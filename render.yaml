services:
  - type: web
    name: queue-management-system
    env: docker
    plan: starter
    branch: main
    dockerfilePath: server/Dockerfile
    autoDeploy: true
    envVars:
      - key: PORT
        value: "5000"
      - key: CORS_ORIGIN
        value: "https://<your-vercel-url>"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "100"

databases:
  - name: queue-management-db
    plan: starter
    region: oregon
